# 빌드된 정적 파일만 내보내는 서버. API 는 별도 오리진(8080)으로 직접 부른다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 화면 이동은 쿼리스트링으로 하지만, 어떤 주소로 새로고침하든 index.html 이 나와야 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 파일 이름에 해시가 붙어 있어서 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 캐시하면 새 배포가 반영되지 않는다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
