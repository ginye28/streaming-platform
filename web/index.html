<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>스트리밍 플랫폼</title>

    <!--
      자바스크립트가 오기 전의 첫 화면. 상단바와 칩 줄, 카드 자리가 같은 크기로 먼저 잡힌다.
      앱이 뜨면 React 가 #root 를 통째로 바꾸므로 따로 치울 필요가 없다. 색과 크기는 base.css·shell.css 와 맞춰 둔다.
      밝은 화면이 기본이고, 나이트 모드를 켜 둔 사람에게는 처음부터 어두운 뼈대가 보이도록 테마를 먼저 읽는다.
    -->
    <script>
      try {
        var dark = localStorage.getItem('theme') === 'dark'
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0f0f12' : '#ffffff'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <style>
      html { --sk-bg: #ffffff; --sk-block: #f2f4f6; --sk-line: #e5e8eb; background: var(--sk-bg); }
      html[data-theme='dark'] { --sk-bg: #0f0f12; --sk-block: #1e1e24; --sk-line: #26262e; }
      body { margin: 0; background: var(--sk-bg); }
      .sk { min-height: 100vh; }
      .sk i { display: block; background: var(--sk-block); }
      .sk__bar { display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 24px; border-bottom: 1px solid var(--sk-line); }
      .sk__logo { width: 32px; height: 32px; border-radius: 9px; }
      .sk__search { flex: 1; max-width: 640px; height: 40px; margin-inline: auto; border-radius: 999px; }
      .sk__pill { width: 88px; height: 36px; border-radius: 999px; }
      .sk__main { max-width: 1680px; margin: 0 auto; padding: 12px 24px 64px; }
      .sk__chips { display: flex; gap: 8px; overflow: hidden; }
      .sk__chips i { flex: none; width: 72px; height: 34px; border-radius: 999px; }
      .sk__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 24px 16px; margin-top: 24px; }
      .sk__card { aspect-ratio: 16 / 9; border-radius: 12px; }
      .sk__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .sk i { animation: sk-breathe 1.6s ease-in-out infinite; }
      @keyframes sk-breathe { 50% { opacity: 0.55; } }
      @media (max-width: 720px) {
        .sk__bar { padding: 0 16px; }
        .sk__search { display: none; }
        .sk__pill { margin-left: auto; width: 64px; }
        .sk__main { padding-inline: 16px; }
        .sk__grid { grid-template-columns: 1fr; }
        .sk__card { margin-inline: -16px; border-radius: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="sk" role="status" aria-live="polite" aria-busy="true">
        <span class="sk__sr">화면을 불러오는 중…</span>
        <div class="sk__bar"><i class="sk__logo"></i><i class="sk__search"></i><i class="sk__pill"></i></div>
        <div class="sk__main">
          <div class="sk__chips"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="sk__grid"><i class="sk__card"></i><i class="sk__card"></i><i class="sk__card"></i><i class="sk__card"></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
