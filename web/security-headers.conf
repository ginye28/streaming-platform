# 모든 응답에 붙이는 브라우저 방어 헤더. nginx 는 location 안에 add_header 가 하나라도 있으면
# 바깥(server)의 add_header 를 물려받지 않으므로, 이 파일을 server 와 각 location 에서 include 한다.
#
# 로컬·자체 호스팅용이라 API(8080)·HLS(8081)가 http://localhost 나 LAN 주소일 수 있다.
# 그래서 연결·이미지·영상은 http 도 허용한다. 운영(Vercel)은 web/vercel.json 이 더 엄격하게 준다.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.tosspayments.com https://*.toss.im; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; connect-src 'self' http: https: ws: wss:; frame-src 'self' https://*.tosspayments.com https://*.toss.im; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://*.tosspayments.com https://*.toss.im; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
