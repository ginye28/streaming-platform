# 이미지가 실제로 만들어지는지 확인하고, main 에 들어가면 GHCR 에 올린다.
#
# PR 에서는 만들기만 하고 올리지 않는다. Dockerfile 이 깨졌는지 여기서 걸러진다.
name: Docker

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: ${{ matrix.name }} 이미지
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./api
          - name: web
            context: ./web
          - name: streaming
            context: ./streaming

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 올릴 때만 로그인한다. PR 에서는 다른 저장소에서 온 것일 수 있어 권한이 없다.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag 이름 만들기
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 같은 워크플로가 다시 돌 때 앞선 결과를 재사용한다.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
