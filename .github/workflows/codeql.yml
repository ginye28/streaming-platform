name: CodeQL

# 코드에서 흔한 보안 결함(주입, XSS, 안전하지 않은 API 사용 등)을 정적으로 찾는다.
# 결과는 저장소의 Security → Code scanning 에 모인다. 병합을 막는 검사는 아니다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
