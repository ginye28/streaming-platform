name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 푸시하면 이전 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Java 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 로컬 전용 application-secret/db.yaml 없이도 돌아야 한다.
      # (src/test/resources/application.yaml 이 H2 설정을 제공한다)
      - name: Build and test
        working-directory: api
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: api/build/reports/tests/test
          retention-days: 7

  schema:
    name: 스키마 (MySQL 8.0)
    runs-on: ubuntu-latest

    # 나머지 테스트는 H2 로 돌기 때문에, MySQL 문법인 마이그레이션 SQL 이
    # 엔티티와 어긋나도 거기서는 드러나지 않는다. 이 작업이 그 구멍을 막는다.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: sp_schema_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 빈 DB 에 db/migration 을 전부 적용한 뒤, ddl-auto: validate 로 기동해 본다.
      # 엔티티에 칸을 더해 놓고 마이그레이션을 안 썼으면 여기서 멈춘다.
      - name: 마이그레이션이 엔티티와 맞는지 확인
        working-directory: api
        env:
          SCHEMA_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/sp_schema_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          SCHEMA_TEST_DB_USERNAME: root
          SCHEMA_TEST_DB_PASSWORD: ''
        run: ./gradlew test --tests '*SchemaMigrationTest' --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-test-report
          path: api/build/reports/tests/test
          retention-days: 7

  web:
    name: Web (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
