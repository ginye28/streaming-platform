# 의존성 보안 업데이트를 자동으로 제안한다. 과제 기간에 PR 이 쌓이지 않도록 달마다, 영역마다 최대 2개.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
