worker_processes auto;

events {
    worker_connections 1024;
}

rtmp {
    # ── 바깥에서 들어오는 송출 입구 ──
    #
    # 여기서는 인증만 하고 HLS 는 만들지 않는다.
    # on_publish 가 3xx 를 주면 nginx 는 "이름을 바꾸는" 게 아니라
    # 공개 이름으로 두 번째 송출 세션을 새로 만든다. 원래(스트림 키) 세션도 그대로 살아 있어서,
    # 이 application 에 hls 를 켜 두면 재생목록이 두 벌 생긴다.
    # 그러면 /hls/{스트림키}.m3u8 로도 방송이 그대로 재생되고, 인코딩·디스크도 두 배가 된다.
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # 송출 인증. API 가 2xx 를 주면 허용, 3xx 면 아래 안쪽 통로로 넘긴다.
            # 그 외에는 nginx 가 연결을 끊는다.
            # OBS 의 "스트림 키" 값이 name 파라미터로 전달된다.
            on_publish http://host.docker.internal:8080/api/internal/rtmp/publish;
            on_publish_done http://host.docker.internal:8080/api/internal/rtmp/publish-done;

            # 재생은 HLS 로만 제공하고 RTMP 직접 재생은 막는다.
            deny play all;
        }
    }

    # ── 리다이렉트가 넘어오는 안쪽 통로 ──
    #
    # 루프백에만 열어 두어 컨테이너 밖에서는 닿지 않는다.
    # (docker-compose.yml 에서도 이 포트는 공개하지 않는다)
    # 덕분에 여기에는 nginx 자신의 리다이렉트만 들어오고,
    # 재생목록은 공개 이름 한 벌만 생긴다.
    server {
        listen 127.0.0.1:1936;
        chunk_size 4096;

        application hls {
            live on;
            record off;
            deny play all;

            hls on;
            hls_path /tmp/hls;
            hls_fragment 3s;
            hls_playlist_length 12s;
            hls_cleanup on;

            # 다시보기: 같은 방송을 아래 vod 애플리케이션으로도 흘려 보낸다.
            # 이름이 같아서 /hls/{이름}.m3u8(실시간)과 /vod/{이름}.m3u8(다시보기)이 짝이 된다.
            # 방송마다 이름이 새로 만들어지므로(API 가 UUID 를 준다) 다시보기끼리 서로 덮어쓰지 않는다.
            push rtmp://127.0.0.1:1936/vod;
        }

        # 다시보기 녹화. 실시간 HLS 와 달리 재생목록이 줄어들지 않고 끝까지 쌓이며,
        # 방송이 끝나면 #EXT-X-ENDLIST 가 붙어 처음부터 되감아 볼 수 있다.
        # 조각 파일은 지우지 않는다. 디스크가 차면 오래된 것을 정리해야 한다(docs/06-deployment.md).
        application vod {
            live on;
            deny play all;

            hls on;
            hls_path /tmp/vod;
            hls_type event;
            hls_fragment 6s;
            # 재생목록에 남길 길이. 기본값(30초)이면 오래된 조각이 목록에서 빠져 처음부터 볼 수 없다.
            # 이 길이보다 긴 방송은 앞부분이 다시보기에서 잘린다.
            hls_playlist_length 12h;
            hls_cleanup off;

            # nginx-rtmp 는 방송이 끝나도 재생목록에 끝 표시(#EXT-X-ENDLIST)를 붙이지 않는다.
            # 끝 표시가 없으면 플레이어가 "아직 방송 중" 으로 알고 맨 끝을 따라가려 한다.
            # 방송이 끝난 직후에 직접 붙인다(잠깐 기다리는 것은 nginx 가 마지막 재생목록을 쓰는 것을 먼저 끝내게 하려는 것이다).
            exec_publish_done sh -c "sleep 2; echo '#EXT-X-ENDLIST' >> /tmp/vod/$name.m3u8";
        }
    }
}

http {
    server {
        listen 8081;

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # 다시보기 재생. 실시간(/hls)과 달리 캐시해도 되지만, 방송이 끝나기 전의 재생목록은 계속 바뀐다.
        location /vod {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            return 200 'Streaming server is running';
            add_header Content-Type text/plain;
        }
    }
}
