worker_processes auto;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # 송출 인증. API 가 2xx 를 주면 허용, 그 외에는 nginx 가 연결을 끊는다.
            # 이 콜백이 없으면 누구나 임의의 이름으로 송출할 수 있다.
            # OBS 의 "스트림 키" 값이 name 파라미터로 전달된다.
            on_publish http://host.docker.internal:8080/api/internal/rtmp/publish;
            on_publish_done http://host.docker.internal:8080/api/internal/rtmp/publish-done;

            # 재생은 HLS 로만 제공하고 RTMP 직접 재생은 막는다.
            deny play all;

            # API 가 3xx 를 주면 그 이름으로 송출을 전환한다.
            # 덕분에 재생 URL(/hls/{name}.m3u8)에 송출 키가 아니라 공개 이름이 들어간다.
            # (API 의 app.rtmp.rename-on-publish 설정과 짝을 이룬다)

            hls on;
            hls_path /tmp/hls;
            hls_fragment 3s;
            hls_playlist_length 12s;
            hls_cleanup on;
        }
    }
}

http {
    server {
        listen 8081;

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            return 200 'Streaming server is running';
            add_header Content-Type text/plain;
        }
    }
}
