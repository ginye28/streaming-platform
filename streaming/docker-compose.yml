services:
  streaming:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sp-streaming
    ports:
      - "1935:1935"
      - "8081:8081"
    # nginx 가 호스트에서 도는 API(8080)로 on_publish 콜백을 보낼 수 있게 한다.
    # Linux 에서는 host-gateway 매핑이 필요하다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
