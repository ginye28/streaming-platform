# 로컬 개발용 인프라. 프로젝트 루트에서 실행한다.
#
#   docker compose up -d           # MySQL + 스트리밍 서버 전부
#   docker compose up -d mysql     # MySQL 만
#   docker compose up -d streaming # 스트리밍 서버만
#   docker compose down            # 중지 (데이터는 남음)
#   docker compose down -v         # 중지 + DB 데이터까지 삭제
#
# 백엔드·프론트까지 컨테이너로 통째로 띄우려면 full 프로필을 쓴다.
# 평소 개발할 때는 API 와 화면을 직접 띄우는 게 빠르므로 기본에서는 빠져 있다.
#
#   JWT_SECRET=아무거나-32바이트-넘게 docker compose --profile full up -d --build
#   → 화면 http://localhost:3000 · API http://localhost:8080
#
# JWT_SECRET 은 기본값을 두지 않았다. 안 넣으면 뜨지 않는다.
# 매번 적기 번거로우면 이 파일 옆에 .env 를 만들어 JWT_SECRET=... 한 줄만 적어 두면 된다.

services:
  mysql:
    image: mysql:8.4
    container_name: sp-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: streaming
      MYSQL_USER: streaming
      MYSQL_PASSWORD: streaming
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 여기가 healthy 가 되어야 백엔드를 띄울 수 있다.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  streaming:
    build:
      context: ./streaming
      dockerfile: Dockerfile
    container_name: sp-streaming
    ports:
      - "1935:1935"   # RTMP 송출
      - "8081:8081"   # HLS 재생
    # 1936(안쪽 통로)은 일부러 공개하지 않는다.
    # 컨테이너 안에서 nginx 가 스스로에게 리다이렉트할 때만 쓴다.
    # nginx 가 호스트에서 도는 API(8080)로 on_publish 콜백을 보낼 수 있게 한다.
    # Linux 에서는 host-gateway 매핑이 필요하다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  api:
    profiles: ["full"]
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sp-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # 컨테이너끼리는 서비스 이름으로 찾아간다. localhost 가 아니다.
      DB_URL: jdbc:mysql://mysql:3306/streaming?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: streaming
      DB_PASSWORD: streaming
      # 비워 두면 API 가 "jwt.secret 은 최소 32바이트여야 합니다" 로 멈춘다.
      # (필수로 걸어 두면 mysql 만 띄우는 명령까지 같이 막혀서 기본값을 비워 뒀다.)
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # 시청자 브라우저가 직접 여는 주소라 host 쪽 포트를 적는다.
      HLS_BASE_URL: http://localhost:8081/hls
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # 올린 영상·썸네일. 컨테이너를 지워도 남는다.
      - api-uploads:/app/uploads
    restart: unless-stopped

  web:
    profiles: ["full"]
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Vite 는 빌드할 때 값을 박아 넣는다. 주소를 바꾸려면 --build 로 다시 만들어야 한다.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: sp-web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql-data:
  api-uploads:
