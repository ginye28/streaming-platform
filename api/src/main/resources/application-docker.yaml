# 컨테이너로 띄울 때 쓰는 프로필. docker-compose.yml 의 api 서비스가 이 프로필로 실행한다.
#
# 값은 전부 환경변수로 받는다. 이미지 안에 비밀을 넣지 않기 위해서다.
# JWT_SECRET 만 기본값이 없어서, 안 넣으면 기동하다 멈춘다. 일부러 그렇게 뒀다.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/streaming?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:streaming}
    password: ${DB_PASSWORD:streaming}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 스키마는 Flyway 가 만든다. Hibernate 는 확인만 한다.
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

file:
  # 컨테이너 안 경로. docker-compose.yml 에서 볼륨으로 붙여 둔다.
  upload-dir: /app/uploads

app:
  admin:
    emails: ${ADMIN_EMAILS:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  hls:
    base-url: ${HLS_BASE_URL:http://localhost:8081/hls}

logging:
  level:
    com.sp.api: ${LOG_LEVEL:INFO}
