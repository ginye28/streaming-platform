spring:
  data:
    web:
      pageable:
        max-page-size: 100
  profiles:
    include:
      - secret
      - db

  # 스키마는 db/migration 의 SQL 로만 바뀐다. Hibernate 는 더 이상 표를 손대지 않는다.
  flyway:
    enabled: true
    # 이미 표가 들어 있는 DB 는 V1(베이스라인)을 실행하지 않고 "여기까지는 됐다" 도장만 찍는다.
    # 지금 돌고 있는 DB 를 지우지 않고 그대로 넘겨받기 위한 설정이다.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: ddl-auto 로 만들어져 있던 스키마

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger

file:
  upload-dir: uploads
  # 영상을 올리면 ffmpeg 로 첫 장면을 뽑아 썸네일로 쓴다.
  # ffmpeg 이 없으면 썸네일 없이 업로드만 되니, 안 쓸 거면 enabled 를 false 로 둬도 된다.
  thumbnail:
    enabled: true
    ffmpeg-path: ffmpeg
    timeout-seconds: 20

app:
  admin:
    # 기동 시 ADMIN 권한을 부여할 계정 이메일 (쉼표로 구분).
    # 최초 관리자를 만드는 유일한 통로다. 여기 적은 계정은 먼저 회원가입돼 있어야 한다.
    # 관리자가 한 명 생기면 이후로는 PATCH /api/admin/users/{id}/role 로 승격시킬 수 있다.
    emails: ""

  cors:
    # 프론트엔드 오리진. 배포 시 실제 도메인으로 교체할 것.
    allowed-origins: http://localhost:5173,http://localhost:3000

  hls:
    # 시청자에게 내려줄 HLS 주소. streaming/docker-compose.yml 의 8081 포트.
    base-url: http://localhost:8081/hls

  rtmp:
    # 송출을 공개 이름으로 전환해 재생 URL 에 스트림 키가 드러나지 않게 한다.
    # OBS 송출이 거부되면 false 로 두고 확인할 것 (그 경우 재생 URL 에 키가 노출된다).
    rename-on-publish: true
    # nginx 가 스스로에게 다시 송출할 주소.
    # streaming/nginx.conf 의 "안쪽 통로"(루프백 전용 1936 포트의 hls application)와 짝을 이룬다.
    # 바깥 포트(1935)로 되돌리면 스트림 키 이름으로도 재생목록이 만들어진다.
    redirect-base: rtmp://127.0.0.1:1936/hls

logging:
  level:
    com.sp.api: INFO
