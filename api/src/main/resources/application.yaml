spring:
  profiles:
    include:
      - secret
      - db

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger

file:
  upload-dir: uploads

app:
  cors:
    # 프론트엔드 오리진. 배포 시 실제 도메인으로 교체할 것.
    allowed-origins: http://localhost:5173,http://localhost:3000

  hls:
    # 시청자에게 내려줄 HLS 주소. streaming/docker-compose.yml 의 8081 포트.
    base-url: http://localhost:8081/hls

  rtmp:
    # 송출을 공개 이름으로 전환해 재생 URL 에 스트림 키가 드러나지 않게 한다.
    # OBS 송출이 거부되면 false 로 두고 확인할 것 (그 경우 재생 URL 에 키가 노출된다).
    rename-on-publish: true
    # nginx 가 스스로에게 다시 송출할 주소.
    redirect-base: rtmp://127.0.0.1:1935/live

logging:
  level:
    com.sp.api: INFO
