spring:
  data:
    web:
      pageable:
        max-page-size: 100
  profiles:
    include:
      - secret
      - db

  # 스키마는 db/migration 의 SQL 로만 바뀐다. Hibernate 는 더 이상 표를 손대지 않는다.
  flyway:
    enabled: true
    # 이미 표가 들어 있는 DB 는 V1(베이스라인)을 실행하지 않고 "여기까지는 됐다" 도장만 찍는다.
    # 지금 돌고 있는 DB 를 지우지 않고 그대로 넘겨받기 위한 설정이다.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: ddl-auto 로 만들어져 있던 스키마

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger

file:
  upload-dir: uploads
  # 영상을 올리면 ffmpeg 로 첫 장면을 뽑아 썸네일로 쓴다.
  # ffmpeg 이 없으면 썸네일 없이 업로드만 되니, 안 쓸 거면 enabled 를 false 로 둬도 된다.
  thumbnail:
    enabled: true
    ffmpeg-path: ffmpeg
    timeout-seconds: 20

app:
  payments:
    toss:
      # 토스페이먼츠 "API 개별 연동 키"(test_ck_/test_sk_). 둘 다 있어야 결제가 켜지고, 하나라도 비면 결제는 꺼진다.
      # 시크릿 키는 서버 밖으로 나가지 않는다. 코드나 이미지에 넣지 말고 환경변수로만 준다.
      client-key: ${TOSS_CLIENT_KEY:}
      secret-key: ${TOSS_SECRET_KEY:}
      base-url: https://api.tosspayments.com
      # 웹훅 주소에 ?token=... 으로 붙이는 비밀 값. 비워 두면 검사하지 않는다.
      webhook-token: ${TOSS_WEBHOOK_TOKEN:}

  membership:
    # 유료 구독 한 번에 내는 금액(원)과 이용 기간(일).
    price-krw: ${MEMBERSHIP_PRICE_KRW:4900}
    period-days: ${MEMBERSHIP_PERIOD_DAYS:30}
    # 사용자가 직접 환불할 수 있는 기간(일). 승인된 날부터 센다. 관리자는 기간과 상관없이 환불한다.
    refund-window-days: ${MEMBERSHIP_REFUND_WINDOW_DAYS:7}
    # 채널 주인 수익 장부에서 떼는 서비스 수수료율(%). 장부일 뿐 실제 송금은 하지 않는다.
    platform-fee-percent: ${MEMBERSHIP_PLATFORM_FEE_PERCENT:0}
    # 유료 구독이 끝나기 며칠 전부터 알릴지.
    expiry-notice-days: ${MEMBERSHIP_EXPIRY_NOTICE_DAYS:3}

  admin:
    # 기동 시 ADMIN 권한을 부여할 계정 이메일 (쉼표로 구분).
    # 최초 관리자를 만드는 유일한 통로다. 여기 적은 계정은 먼저 회원가입돼 있어야 한다.
    # 관리자가 한 명 생기면 이후로는 PATCH /api/admin/users/{id}/role 로 승격시킬 수 있다.
    emails: ""

  cors:
    # 프론트엔드 오리진. 배포 시 실제 도메인으로 교체할 것.
    allowed-origins: http://localhost:5173,http://localhost:3000

  hls:
    # 시청자에게 내려줄 HLS 주소. streaming/docker-compose.yml 의 8081 포트.
    base-url: http://localhost:8081/hls

  rtmp:
    # 송출을 공개 이름으로 전환해 재생 URL 에 스트림 키가 드러나지 않게 한다.
    # OBS 송출이 거부되면 false 로 두고 확인할 것 (그 경우 재생 URL 에 키가 노출된다).
    rename-on-publish: true
    # nginx 가 스스로에게 다시 송출할 주소.
    # streaming/nginx.conf 의 "안쪽 통로"(루프백 전용 1936 포트의 hls application)와 짝을 이룬다.
    # 바깥 포트(1935)로 되돌리면 스트림 키 이름으로도 재생목록이 만들어진다.
    redirect-base: rtmp://127.0.0.1:1936/hls

logging:
  level:
    com.sp.api: INFO
