spring:
  profiles:
    include:
      - secret
      - db

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger

file:
  upload-dir: uploads

app:
  cors:
    # 프론트엔드 오리진. 배포 시 실제 도메인으로 교체할 것.
    allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.sp.api: INFO
