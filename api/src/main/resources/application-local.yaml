# MySQL 없이 바로 띄우기 위한 개발용 프로필.
#   ./gradlew bootRun --args='--spring.profiles.active=local'
#
# 파일 기반 H2 라 서버를 껐다 켜도 데이터가 남는다. (api/data/ 에 저장)
# application-secret.yaml / application-db.yaml 이 없어도 동작한다.
spring:
  datasource:
    url: jdbc:h2:file:./data/streaming;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      # http://localhost:8080/h2-console 에서 데이터 확인 가능
      enabled: true
      path: /h2-console

jwt:
  # 개발 전용 값. 배포에는 절대 쓰지 말 것.
  secret: local-development-only-secret-key-32bytes+
  expiration: 86400000

logging:
  level:
    com.sp.api: DEBUG
